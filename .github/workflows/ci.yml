name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          USERS_TABLE: MarqueUsers
          EVENTS_TABLE: MarqueEvents
          EVENT_STAFF_TABLE: MarqueEventStaff
          RSVPS_TABLE: MarqueRSVPs
          WAITLIST_TABLE: MarqueWaitlist
          TICKETS_TABLE: MarqueTickets
          S3_BUCKET: test-bucket
          JWT_SECRET: super-secret-key-that-is-at-least-32-chars-long
          JWT_EXPIRES_IN: 24h
          AWS_REGION: ap-south-1

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Run frontend production build
        run: npm run build
        working-directory: frontend
